name: Diagnose

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: mcp-telegram
    steps:
      - name: Service state + logs
        run: |
          echo "=== Service tasks ==="
          docker service ps mcp-telegram_cloud --no-trunc | head -15
          echo ""
          echo "=== Running containers ==="
          docker ps --filter "label=com.docker.swarm.service.name=mcp-telegram_cloud" \
            --format 'CID={{.ID}} image={{.Image}} status={{.Status}}'
          echo ""
          echo "=== Last 300 service log lines ==="
          docker service logs mcp-telegram_cloud --tail 300 2>&1 | tail -300 || true

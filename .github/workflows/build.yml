name: Build

# Builds and pushes the cloud Docker image to GHCR.
# Deploy lives in the private mcp-telegram-infra repo and is triggered manually:
#   gh workflow run deploy.yml --repo mcp-telegram/mcp-telegram-infra -f image_tag=<sha-or-tag>
# (Auto-dispatch on push is intentionally not wired here to avoid maintaining
#  a cross-repo PAT — flip if release cadence makes manual triggers painful.)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - LICENSE
      - "docs/**"
      - "claudedocs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - LICENSE
      - "docs/**"
      - "claudedocs/**"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_NAME_WEB: ghcr.io/${{ github.repository_owner }}/mcp-telegram-web

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # `bun install` hits sporadic IntegrityCheckFailed on shared GH runners
      # (same flake reproduced locally). npm install reads package.json
      # deterministically; Bun runtime reads node_modules unchanged.
      # `--ignore-scripts` skips native compilation for utf-8-validate /
      # bufferutil (optional speedups for `ws`); JS fallback is identical.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check-parity
      - run: bun run check-telemetry
      # Infra repo (mcp-telegram-infra) ships the Traefik stack and isn't
      # checked out here, so this step skips itself with a clear message.
      # The real value of check-traefik-parity is local pre-commit: if a
      # maintainer with both repos cloned side-by-side adds a new
      # `app.route("/X", ...)` mount without updating the Traefik
      # PathPrefix list, the script blocks the commit (v2.32.0 lesson).
      - run: bun run check-traefik-parity
      # Web workspace (Next.js content site) — same install handles both
      # because it's a Bun workspace; we just need to validate web too.
      - run: bun run web:lint
      - run: bun run web:typecheck
      # App workspace (React backend pages: SSR + i18n islands). Same install
      # covers it. `app:build` produces dist/ + dist-ssr/ which the Docker
      # build also generates; running it here catches build breakage early.
      - run: bun run app:lint
      - run: bun run app:typecheck
      - run: bun run app:test
      - run: bun run app:build

  build:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          REF="${{ github.ref }}"
          TAGS="${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${VERSION}"
            MINOR="${VERSION%.*}"
            MAJOR="${MINOR%.*}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${MINOR},${{ env.IMAGE_NAME }}:${MAJOR}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  build-web:
    # Builds mcp-telegram-web image (Next.js content site) in parallel with
    # the backend image. Same tagging scheme; runs on the same triggers but
    # only when files relevant to the web build change OR on tags
    # (release semver flow always runs both).
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          REF="${{ github.ref }}"
          TAGS="${{ env.IMAGE_NAME_WEB }}:${{ github.sha }},${{ env.IMAGE_NAME_WEB }}:latest"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,${{ env.IMAGE_NAME_WEB }}:${VERSION}"
            MINOR="${VERSION%.*}"
            MAJOR="${MINOR%.*}"
            TAGS="$TAGS,${{ env.IMAGE_NAME_WEB }}:${MINOR},${{ env.IMAGE_NAME_WEB }}:${MAJOR}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Public analytics IDs baked into the SSG build. Sourced from repo
          # vars (not code) so the OSS image stays clean; empty when unset.
          build-args: |
            METRIKA_ID=${{ vars.METRIKA_ID }}
            GA4_ID=${{ vars.GA4_ID }}

  release:
    needs: [build, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s" --no-merges | grep -v "Co-Authored-By")
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Docker

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker pull ${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }}
            ```

            ## Deploy

            Deploy lives in private `mcp-telegram-infra`. Trigger:

            ```bash
            gh workflow run deploy.yml --repo mcp-telegram/mcp-telegram-infra \
              -f image_tag=${{ github.ref_name }}
            ```

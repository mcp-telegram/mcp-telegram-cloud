name: Setup Bot Webhook

# One-shot configurator for the broadcast bot's Telegram webhook.
# Reads BOT_TOKEN / BOT_WEBHOOK_SECRET from secrets and tells Telegram to POST
# updates to ${ISSUER}/bot/webhook/<secret>. Use whenever the secret rotates
# or when first wiring the bot to a new deployment.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: set
        options:
          - set
          - info
          - delete

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run setup-bot-webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          ISSUER: https://mcp-telegram.com
        run: |
          case "${{ inputs.action }}" in
            set)    node --experimental-strip-types scripts/setup-bot-webhook.ts ;;
            info)   node --experimental-strip-types scripts/setup-bot-webhook.ts --info ;;
            delete) node --experimental-strip-types scripts/setup-bot-webhook.ts --delete ;;
          esac

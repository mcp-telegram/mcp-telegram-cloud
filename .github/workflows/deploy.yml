name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - LICENSE

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${VERSION}"
            # v1.0.0 -> v1.0, v1
            MINOR="${VERSION%.*}"
            MAJOR="${MINOR%.*}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${MINOR},${{ env.IMAGE_NAME }}:${MAJOR}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    needs: build
    runs-on: mcp-telegram
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Create network
        run: docker network create --driver=overlay --attachable ${{ vars.SHARE_NETWORK_NAME }} 2>/dev/null || true

      - name: Deploy Traefik
        env:
          SHARE_NETWORK_NAME: ${{ vars.SHARE_NETWORK_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: docker stack deploy -c stacks/traefik.yml traefik

      - name: Deploy MCP Telegram
        env:
          DOCKER_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          SHARE_NETWORK_NAME: ${{ vars.SHARE_NETWORK_NAME }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: docker stack deploy -c stacks/mcp-telegram.yml mcp-telegram

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # Generate changelog from commits
          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s" --no-merges | grep -v "Co-Authored-By")
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Docker

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
          generate_release_notes: false

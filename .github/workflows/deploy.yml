name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - LICENSE

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${VERSION}"
            # v1.0.0 -> v1.0, v1
            MINOR="${VERSION%.*}"
            MAJOR="${MINOR%.*}"
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:${MINOR},${{ env.IMAGE_NAME }}:${MAJOR}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    needs: build
    runs-on: mcp-telegram
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Create network
        run: docker network create --driver=overlay --attachable ${{ vars.SHARE_NETWORK_NAME }} 2>/dev/null || true

      - name: Deploy Traefik
        env:
          SHARE_NETWORK_NAME: ${{ vars.SHARE_NETWORK_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: docker stack deploy -c stacks/traefik.yml traefik

      - name: Deploy MCP Telegram
        env:
          DOCKER_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          SHARE_NETWORK_NAME: ${{ vars.SHARE_NETWORK_NAME }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SIGNOZ_ENDPOINT: ${{ secrets.SIGNOZ_ENDPOINT }}
          OPENAI_APPS_CHALLENGE: ${{ secrets.OPENAI_APPS_CHALLENGE }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CONTACT_TELEGRAM: ${{ secrets.CONTACT_TELEGRAM }}
          LOG_HASH_SALT: ${{ secrets.LOG_HASH_SALT }}
        run: docker stack deploy -c stacks/mcp-telegram.yml mcp-telegram

      - name: Post-deploy smoke test
        run: |
          EXPECTED="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Wait for a Running task with the new image (not just Spec).
          for i in $(seq 1 60); do
            RUNNING_TASK=$(docker service ps mcp-telegram_cloud \
              --filter "desired-state=running" \
              --format '{{.CurrentState}}|{{.Image}}' | head -1)
            STATE=$(echo "$RUNNING_TASK" | cut -d'|' -f1)
            IMAGE=$(echo "$RUNNING_TASK" | cut -d'|' -f2)
            if echo "$STATE" | grep -q "^Running" && [ "$IMAGE" = "$EXPECTED" ]; then
              echo "New task running: $RUNNING_TASK"
              break
            fi
            echo "Waiting for new task... ($i/60) state=$STATE image=$IMAGE"
            sleep 2
          done
          # Give healthcheck a moment to mark it healthy
          sleep 3
          # Get container ID of the NEW task (filter by image, not just service)
          CID=$(docker ps \
            --filter "label=com.docker.swarm.service.name=mcp-telegram_cloud" \
            --filter "ancestor=$EXPECTED" \
            --format '{{.ID}}' | head -1)
          if [ -z "$CID" ]; then
            echo "No new-image container running yet — falling back to any"
            CID=$(docker ps --filter "label=com.docker.swarm.service.name=mcp-telegram_cloud" --format '{{.ID}}' | head -1)
          fi
          # Confirm image
          docker inspect "$CID" --format 'Container {{.Id}} image={{.Config.Image}}'
          echo "=== /mcp/ ==="
          docker exec "$CID" sh -c 'wget -qO- --post-data="" --server-response http://localhost:3000/mcp/ 2>&1 | head -10 || true'
          echo "=== /mcp ==="
          docker exec "$CID" sh -c 'wget -qO- --post-data="" --server-response http://localhost:3000/mcp 2>&1 | head -10 || true'
          echo "=== /health ==="
          docker exec "$CID" sh -c 'wget -qO- --server-response http://localhost:3000/health 2>&1 | head -10 || true'

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # Generate changelog from commits
          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s" --no-merges | grep -v "Co-Authored-By")
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Docker

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
          generate_release_notes: false

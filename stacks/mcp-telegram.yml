services:
  cloud:
    image: $DOCKER_IMAGE
    networks:
      - share
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      placement:
        constraints:
          - node.role == manager
    environment:
      TELEGRAM_API_ID: $TELEGRAM_API_ID
      TELEGRAM_API_HASH: $TELEGRAM_API_HASH
      ADMIN_TOKEN: $ADMIN_TOKEN
      ISSUER: "https://mcp-telegram.com"
      BRAND_NAME: "MCP Telegram"
      PORT: "3000"
      NODE_ENV: production
      SIGNOZ_ENDPOINT: $SIGNOZ_ENDPOINT
      OPENAI_APPS_CHALLENGE: $OPENAI_APPS_CHALLENGE
      CONTACT_EMAIL: $CONTACT_EMAIL
      CONTACT_TELEGRAM: $CONTACT_TELEGRAM
      LOG_HASH_SALT: $LOG_HASH_SALT
      BOT_TOKEN: $BOT_TOKEN
      BOT_USERNAME: $BOT_USERNAME
      BOT_WEBHOOK_SECRET: $BOT_WEBHOOK_SECRET
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcp-telegram.rule: 'Host("mcp-telegram.com")'
      traefik.http.routers.mcp-telegram.entrypoints: websecure
      traefik.http.routers.mcp-telegram.tls.certresolver: letsencrypt
      traefik.http.services.mcp-telegram.loadbalancer.server.port: 3000

volumes:
  data:

networks:
  share:
    external: true
    name: $SHARE_NETWORK_NAME
